name: Fetch MVRV Data

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fetch-mvrv-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Coin Metrics data (fails loudly instead of writing partial/empty data)
        id: fetch
        run: |
          set -euo pipefail
          URL="https://community-api.coinmetrics.io/v4/timeseries/asset-metrics?assets=btc&metrics=PriceUSD,CapMVRVCur,CapRealUSD,SplyCur,CapMrktCurUSD&frequency=1d&page_size=10000"
          # A plain curl UA/request from a GitHub-runner IP gets a 403 (confirmed in a prior run) while a
          # real mobile browser hitting the same URL works fine, so mimic an ordinary browser request.
          HTTP_CODE=$(curl -sS --retry 3 --retry-delay 5 -w "%{http_code}" -o /tmp/cm_response.json \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            "$URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "API returned HTTP $HTTP_CODE - aborting without committing anything. Response body:" >&2
            cat /tmp/cm_response.json >&2
            exit 1
          fi
          RAW=$(cat /tmp/cm_response.json)
          ROWCOUNT=$(echo "$RAW" | jq '.data | length')
          if [ -z "$ROWCOUNT" ] || [ "$ROWCOUNT" -lt 100 ]; then
            echo "API returned too few rows ($ROWCOUNT) - aborting without committing anything." >&2
            exit 1
          fi
          FETCHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          AS_OF=$(echo "$RAW" | jq -r '.data[-1].time[0:10]')
          mkdir -p data/mvrv/history
          echo "$RAW" | jq --arg fetchedAt "$FETCHED_AT" --arg source "$URL" --arg asOf "$AS_OF" \
            '{fetchedAt:$fetchedAt, source:$source, asOf:$asOf, rowCount:(.data|length), data:.data}' \
            > data/mvrv/latest.json
          cp data/mvrv/latest.json "data/mvrv/history/${AS_OF}.json"
          echo "as_of=$AS_OF" >> "$GITHUB_OUTPUT"
          echo "row_count=$ROWCOUNT" >> "$GITHUB_OUTPUT"
          echo "fetched_at=$FETCHED_AT" >> "$GITHUB_OUTPUT"

      - name: Commit snapshot and open PR (main is branch-protected, no direct push)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/mvrv; then
            echo "No data changes since last run, nothing to commit."
            exit 0
          fi
          BRANCH="mvrv-data-${{ steps.fetch.outputs.as_of }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/mvrv
          git commit -m "Update MVRV data snapshot (${{ steps.fetch.outputs.as_of }}, ${{ steps.fetch.outputs.row_count }} rows)"
          git push -u origin "$BRANCH"
          gh pr create --title "Update MVRV data snapshot (${{ steps.fetch.outputs.as_of }})" \
            --body "Automated Coin Metrics Community API fetch, unmodified. Data as of ${{ steps.fetch.outputs.as_of }}, fetched at ${{ steps.fetch.outputs.fetched_at }}, ${{ steps.fetch.outputs.row_count }} rows." \
            --base main --head "$BRANCH"
          gh pr merge "$BRANCH" --squash --admin || echo "Could not auto-merge (likely needs a manual review/merge) - PR is open for that."
