name: Fetch Coin Chart Snapshots

on:
  workflow_dispatch: {}
  schedule:
    - cron: "10 7 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fetch-coin-charts
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch market_chart data for every watchlist coin, all ranges (server-side, no CORS)
        id: fetch
        timeout-minutes: 60
        run: |
          set -euo pipefail
          python3 <<'PY'
          import csv, json, os, sys, time, urllib.error, urllib.request
          from datetime import datetime, timezone

          # 1825 (5-year, daily-interval) dropped: confirmed via a real run to come back
          # HTTP 401 Unauthorized on the keyless tier for multiple coins - not a rate-limit
          # hiccup, that range simply isn't available without a paid API key.
          RANGES = ["1", "7", "30", "365"]
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          # Two sources, both already maintained daily by other jobs, merged so nothing here
          # needs a third, driftable coin list of its own:
          # 1. data/altcoins/latest.json - the Altcoins tab's top-10-by-market-cap coins.
          #    Fetched first since these are the highest-traffic cards on the dashboard.
          # 2. data/watchlist.csv's CoinGeckoID column - the daily scan routine's pump candidates.
          ids = []
          try:
              with open("data/altcoins/latest.json", encoding="utf-8") as f:
                  top10 = json.load(f)
              for c in top10.get("data", []):
                  cgid = (c.get("id") or "").strip()
                  if cgid and cgid not in ids:
                      ids.append(cgid)
          except FileNotFoundError:
              print("WARN data/altcoins/latest.json not found yet, skipping top-10 coins", file=sys.stderr)

          with open("data/watchlist.csv", newline="", encoding="utf-8") as f:
              for row in csv.DictReader(f):
                  cgid = (row.get("CoinGeckoID") or "").strip()
                  if cgid and cgid not in ids:
                      ids.append(cgid)
          print(f"Found {len(ids)} CoinGecko IDs: {ids}", file=sys.stderr)

          def downsample(prices, target=60):
              if not prices:
                  return []
              step = max(1, len(prices) // target)
              return [p for i, p in enumerate(prices) if i % step == 0 or i == len(prices) - 1]

          # A first real run with a flat 2.1s gap (the documented 30 req/min keyless limit)
          # got 429'd starting on roughly the 5th-6th call and stayed 429'd for the rest of
          # the run - GitHub-hosted runners share IP pools, so the *effective* limit at any
          # given moment is whatever's left of that shared IP's budget, not the full 30/min.
          # This backs off hard on 429 (retried, not just logged) and adapts the steady-state
          # gap up/down based on recent history instead of trusting a fixed number.
          BASE_DELAY = 3.0
          MAX_DELAY = 45.0
          MAX_RETRIES_PER_CALL = 3
          CIRCUIT_BREAKER_LIMIT = 8  # consecutive full-failures -> assume it's not recovering, stop early

          delay = BASE_DELAY
          consecutive_successes = 0
          consecutive_full_failures = 0

          def fetch_market_chart(cgid, days):
              url = f"https://api.coingecko.com/api/v3/coins/{cgid}/market_chart?vs_currency=usd&days={days}"
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/json"})
              for attempt in range(MAX_RETRIES_PER_CALL + 1):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          return json.loads(resp.read())
                  except urllib.error.HTTPError as e:
                      if e.code == 429 and attempt < MAX_RETRIES_PER_CALL:
                          global delay
                          delay = min(delay * 2, MAX_DELAY)
                          print(f"  429 on {cgid} days={days}, backing off to {delay:.0f}s (retry {attempt+1}/{MAX_RETRIES_PER_CALL})", file=sys.stderr)
                          time.sleep(delay)
                          continue
                      raise

          result = {}
          success = 0
          total = 0
          for cgid in ids:
              per_coin = {}
              for days in RANGES:
                  total += 1
                  try:
                      data = fetch_market_chart(cgid, days)
                      prices = data.get("prices", [])
                      if prices:
                          per_coin[days] = downsample(prices)
                          success += 1
                          consecutive_successes += 1
                          consecutive_full_failures = 0
                          if consecutive_successes >= 5 and delay > BASE_DELAY:
                              delay = max(BASE_DELAY, delay / 2)
                              consecutive_successes = 0
                      else:
                          print(f"WARN empty prices for {cgid} days={days}", file=sys.stderr)
                          consecutive_successes = 0
                  except Exception as e:
                      print(f"WARN failed {cgid} days={days}: {e}", file=sys.stderr)
                      consecutive_successes = 0
                      consecutive_full_failures += 1
                      if consecutive_full_failures >= CIRCUIT_BREAKER_LIMIT:
                          print(f"{CIRCUIT_BREAKER_LIMIT} consecutive full failures - CoinGecko isn't recovering, stopping early instead of burning the rest of the job.", file=sys.stderr)
                          break
                  time.sleep(delay)
              if per_coin:
                  result[cgid] = per_coin
              if consecutive_full_failures >= CIRCUIT_BREAKER_LIMIT:
                  break

          print(f"Success: {success}/{total}", file=sys.stderr)
          if total == 0 or success / total < 0.5:
              print("Success rate too low - aborting without committing anything.", file=sys.stderr)
              sys.exit(1)

          fetched_at = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          os.makedirs("data/altcoins", exist_ok=True)
          with open("data/altcoins/charts.json", "w", encoding="utf-8") as f:
              json.dump({"fetchedAt": fetched_at, "coins": result}, f, ensure_ascii=False, separators=(",", ":"))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"fetched_at={fetched_at}\n")
              f.write(f"coin_count={len(result)}\n")
              f.write(f"success={success}\n")
              f.write(f"total={total}\n")
          PY

      - name: Commit snapshot and open PR (main is branch-protected, no direct push)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/altcoins/charts.json)" ]; then
            echo "No data changes since last run, nothing to commit."
            exit 0
          fi
          BRANCH="coin-charts-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/altcoins/charts.json
          git commit -m "Update coin chart snapshots (${{ steps.fetch.outputs.fetched_at }}, ${{ steps.fetch.outputs.coin_count }} coins, ${{ steps.fetch.outputs.success }}/${{ steps.fetch.outputs.total }} ranges)"
          git push -u origin "$BRANCH"
          gh pr create --title "Update coin chart snapshots" \
            --body "Automated CoinGecko /coins/{id}/market_chart fetch (5 ranges per coin, downsampled to ~60 points each), server-side to avoid CoinGecko's CORS block on direct browser fetches. Fetched at ${{ steps.fetch.outputs.fetched_at }}, ${{ steps.fetch.outputs.coin_count }} coins, ${{ steps.fetch.outputs.success }}/${{ steps.fetch.outputs.total }} coin×range combinations succeeded." \
            --base main --head "$BRANCH"
          gh pr merge "$BRANCH" --squash --admin || echo "Could not auto-merge (likely needs a manual review/merge) - PR is open for that."
          git push origin --delete "$BRANCH" || true
